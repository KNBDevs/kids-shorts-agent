name: voices
on:
  workflow_dispatch:
    inputs:
      chars:
        description: "Characters"
        default: "pimo,ruki,luma,tuki,moki,bopi,bolita,gruno"
permissions:
  contents: write
concurrency:
  group: voices
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q numpy scipy faster-whisper
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python voices/gemini_bake.py "${{ inputs.chars }}"
      - if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add assets/vo && git commit -qm "update assets" && git pull -q --rebase && git push -q || true
